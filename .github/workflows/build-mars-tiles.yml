name: Build Mars tiles

# Builds self-hosted Mars terrain + color tiles from free NASA/USGS data and
# uploads them to Cloudflare R2 (bucket auridei-tiles, served at
# https://tiles.auridei.com/mars/). Run it from the Actions tab → "Run workflow".
#
# Needs three repository secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
# Self-contained: the helper scripts are written by the first step, so this one
# file is all the repository needs.

on:
  workflow_dispatch:
    inputs:
      part:
        description: "What to build"
        type: choice
        options: [both, imagery, terrain]
        default: both
      max_zoom:
        description: "Deepest zoom level (8 = full detail)"
        default: "8"

env:
  BUCKET: auridei-tiles
  BODY: mars
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"

jobs:
  imagery:
    if: ${{ inputs.part == 'both' || inputs.part == 'imagery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Write helper scripts
        run: |
          mkdir -p scripts
          cat > scripts/prepare_workdir.sh <<'AURIDEI_EOF'
          #!/bin/bash
          # Frees disk space on the GitHub runner and picks the biggest free disk for work.
          set -e
          echo "Disk before cleanup:"; df -h / /mnt 2>/dev/null || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          ROOT_FREE=$(df --output=avail -k / | tail -1)
          MNT_FREE=$(df --output=avail -k /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${MNT_FREE:-0}" -gt "$ROOT_FREE" ]; then WORK=/mnt/work; else WORK=$HOME/work; fi
          sudo mkdir -p "$WORK" && sudo chown -R "$USER" "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "Disk after cleanup:"; df -h / /mnt 2>/dev/null || df -h /
          echo "Working in $WORK"
          AURIDEI_EOF
          cat > scripts/finish_terrain.py <<'AURIDEI_EOF'
          """
          Prepare Cesium quantized-mesh terrain for plain static hosting:
          cesium-terrain-builder writes every .terrain tile gzip-compressed, which only
          works if the server adds a 'Content-Encoding: gzip' header. Unzipping them here
          means any static host (Cloudflare R2, Firebase) serves them correctly as-is.

          Usage: python3 finish_terrain.py TERRAIN_DIR
          """
          import gzip, os, sys

          root = sys.argv[1]
          n = 0
          for dirpath, _, files in os.walk(root):
              for f in files:
                  if not f.endswith('.terrain'):
                      continue
                  path = os.path.join(dirpath, f)
                  with open(path, 'rb') as fh:
                      data = fh.read()
                  if data[:2] == b'\x1f\x8b':
                      with open(path, 'wb') as fh:
                          fh.write(gzip.decompress(data))
                      n += 1
          print(f'Unzipped {n:,} terrain tiles in {root}')
          AURIDEI_EOF
          cat > scripts/tile_imagery.py <<'AURIDEI_EOF'
          """
          Cut a global Simple Cylindrical (equirectangular) mosaic into Cesium imagery
          tiles: GeographicTilingScheme, 256x256 px, XYZ numbering (y = 0 at the north),
          folders  <out>/<z>/<x>/<y>.jpg   — the same layout Venus uses.

          Works directly in pixel space, so the source file needs no coordinate system:
          the mosaic just has to cover the whole planet (-180..180 lon, 90..-90 lat).

          Usage (inside the GDAL Docker container):
            python3 tile_imagery.py SOURCE.tif OUT_DIR --max-zoom 8 [--workers 8] [--quality 85]

          Re-running skips tiles that already exist, so it can be stopped and resumed.
          """
          import argparse, os, sys, time
          from multiprocessing import Pool
          from osgeo import gdal

          gdal.UseExceptions()
          gdal.SetCacheMax(512 * 1024 * 1024)

          SRC = None
          ARGS = None


          def init(src_path, args):
              global SRC, ARGS
              SRC = gdal.Open(src_path)
              ARGS = args


          def tile_job(job):
              z, x = job
              W, H = SRC.RasterXSize, SRC.RasterYSize
              tiles_y = 2 ** z
              deg = 180.0 / tiles_y                      # tile size in degrees
              made = 0
              for y in range(tiles_y):
                  out = os.path.join(ARGS.out, str(z), str(x), f"{y}.{ARGS.ext}")
                  if os.path.exists(out):
                      continue
                  west = -180.0 + x * deg
                  north = 90.0 - y * deg
                  # degrees -> source pixels (float), then clamp to the raster
                  px0 = (west + 180.0) / 360.0 * W
                  py0 = (90.0 - north) / 180.0 * H
                  pw = deg / 360.0 * W
                  ph = deg / 180.0 * H
                  os.makedirs(os.path.dirname(out), exist_ok=True)
                  opts = gdal.TranslateOptions(
                      format='JPEG' if ARGS.ext == 'jpg' else 'PNG',
                      srcWin=[px0, py0, pw, ph],
                      width=ARGS.size, height=ARGS.size,
                      resampleAlg='average' if pw > ARGS.size else 'bilinear',
                      creationOptions=[f'QUALITY={ARGS.quality}'] if ARGS.ext == 'jpg' else [],
                      bandList=[1, 2, 3] if SRC.RasterCount >= 3 else [1],
                  )
                  tmp = out + '.part'
                  gdal.Translate(tmp, SRC, options=opts)
                  for extra in (tmp + '.aux.xml',):
                      if os.path.exists(extra):
                          os.remove(extra)
                  os.replace(tmp, out)
                  made += 1
              return made


          def main():
              p = argparse.ArgumentParser()
              p.add_argument('source')
              p.add_argument('out')
              p.add_argument('--max-zoom', type=int, default=8)
              p.add_argument('--min-zoom', type=int, default=0)
              p.add_argument('--workers', type=int, default=max(1, (os.cpu_count() or 2) - 1))
              p.add_argument('--quality', type=int, default=85)
              p.add_argument('--size', type=int, default=256)
              p.add_argument('--ext', choices=['jpg', 'png'], default='jpg')
              args = p.parse_args()

              ds = gdal.Open(args.source)
              print(f'Source: {ds.RasterXSize} x {ds.RasterYSize}, {ds.RasterCount} band(s)')
              if ds.GetRasterBand(1).GetOverviewCount() == 0:
                  print('Note: no overviews found. Low zoom levels will be slow; run gdaladdo first (see README).')
              ds = None

              jobs = [(z, x) for z in range(args.min_zoom, args.max_zoom + 1) for x in range(2 ** (z + 1))]
              total_tiles = sum(2 ** (z + 1) * 2 ** z for z in range(args.min_zoom, args.max_zoom + 1))
              print(f'Zoom {args.min_zoom}-{args.max_zoom}: {total_tiles:,} tiles, {args.workers} workers')
              t0 = time.time(); done = 0
              with Pool(args.workers, initializer=init, initargs=(args.source, args)) as pool:
                  for i, n in enumerate(pool.imap_unordered(tile_job, jobs), 1):
                      done += n
                      if i % 50 == 0 or i == len(jobs):
                          print(f'  columns {i}/{len(jobs)}  new tiles {done:,}  {time.time()-t0:,.0f}s', flush=True)
              print('Imagery tiles done.')


          if __name__ == '__main__':
              main()
          AURIDEI_EOF
          ls -l scripts
      - name: Free disk space
        run: bash scripts/prepare_workdir.sh
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gdal-bin python3-gdal aria2 rclone
          rclone version | head -1
      - name: Check R2 access
        run: rclone lsf r2:$BUCKET --max-depth 1 || (echo "::error::Can't reach the R2 bucket. Check the three R2 secrets and that the bucket name is $BUCKET." && exit 1)
      - name: Download Viking color mosaic (~12 GB)
        working-directory: ${{ env.WORK }}
        run: |
          aria2c -x 8 -s 8 --max-tries=10 --retry-wait=10 -o color.tif \
            "https://planetarymaps.usgs.gov/mosaic/Mars_Viking_MDIM21_ClrMosaic_global_232m.tif"
          ls -lh color.tif
      - name: Convert to a fast, tiled file
        working-directory: ${{ env.WORK }}
        run: |
          gdal_translate -q -of GTiff -co TILED=YES -co COMPRESS=JPEG -co PHOTOMETRIC=YCBCR \
            -co JPEG_QUALITY=92 -co BIGTIFF=YES --config GDAL_CACHEMAX 2048 color.tif color_tiled.tif
          rm color.tif
          gdaladdo -q -r average --config COMPRESS_OVERVIEW JPEG --config PHOTOMETRIC_OVERVIEW YCBCR \
            color_tiled.tif 2 4 8 16 32 64 128 256
          ls -lh; df -h .
      - name: Cut color tiles
        run: |
          python3 scripts/tile_imagery.py "$WORK/color_tiled.tif" "$WORK/tiles/imagery" \
            --max-zoom ${{ inputs.max_zoom }} --workers $(nproc)
          echo "Tiles: $(find $WORK/tiles/imagery -type f | wc -l)   Size: $(du -sh $WORK/tiles/imagery | cut -f1)"
      - name: Upload color tiles to R2
        run: |
          rclone copy "$WORK/tiles/imagery" r2:$BUCKET/$BODY/imagery \
            --transfers 48 --checkers 48 --fast-list --stats 60s --stats-one-line
          echo "Done: https://tiles.auridei.com/$BODY/imagery/0/0/0.jpg"

  terrain:
    if: ${{ inputs.part == 'both' || inputs.part == 'terrain' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Write helper scripts
        run: |
          mkdir -p scripts
          cat > scripts/prepare_workdir.sh <<'AURIDEI_EOF'
          #!/bin/bash
          # Frees disk space on the GitHub runner and picks the biggest free disk for work.
          set -e
          echo "Disk before cleanup:"; df -h / /mnt 2>/dev/null || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          ROOT_FREE=$(df --output=avail -k / | tail -1)
          MNT_FREE=$(df --output=avail -k /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${MNT_FREE:-0}" -gt "$ROOT_FREE" ]; then WORK=/mnt/work; else WORK=$HOME/work; fi
          sudo mkdir -p "$WORK" && sudo chown -R "$USER" "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "Disk after cleanup:"; df -h / /mnt 2>/dev/null || df -h /
          echo "Working in $WORK"
          AURIDEI_EOF
          cat > scripts/finish_terrain.py <<'AURIDEI_EOF'
          """
          Prepare Cesium quantized-mesh terrain for plain static hosting:
          cesium-terrain-builder writes every .terrain tile gzip-compressed, which only
          works if the server adds a 'Content-Encoding: gzip' header. Unzipping them here
          means any static host (Cloudflare R2, Firebase) serves them correctly as-is.

          Usage: python3 finish_terrain.py TERRAIN_DIR
          """
          import gzip, os, sys

          root = sys.argv[1]
          n = 0
          for dirpath, _, files in os.walk(root):
              for f in files:
                  if not f.endswith('.terrain'):
                      continue
                  path = os.path.join(dirpath, f)
                  with open(path, 'rb') as fh:
                      data = fh.read()
                  if data[:2] == b'\x1f\x8b':
                      with open(path, 'wb') as fh:
                          fh.write(gzip.decompress(data))
                      n += 1
          print(f'Unzipped {n:,} terrain tiles in {root}')
          AURIDEI_EOF
          cat > scripts/tile_imagery.py <<'AURIDEI_EOF'
          """
          Cut a global Simple Cylindrical (equirectangular) mosaic into Cesium imagery
          tiles: GeographicTilingScheme, 256x256 px, XYZ numbering (y = 0 at the north),
          folders  <out>/<z>/<x>/<y>.jpg   — the same layout Venus uses.

          Works directly in pixel space, so the source file needs no coordinate system:
          the mosaic just has to cover the whole planet (-180..180 lon, 90..-90 lat).

          Usage (inside the GDAL Docker container):
            python3 tile_imagery.py SOURCE.tif OUT_DIR --max-zoom 8 [--workers 8] [--quality 85]

          Re-running skips tiles that already exist, so it can be stopped and resumed.
          """
          import argparse, os, sys, time
          from multiprocessing import Pool
          from osgeo import gdal

          gdal.UseExceptions()
          gdal.SetCacheMax(512 * 1024 * 1024)

          SRC = None
          ARGS = None


          def init(src_path, args):
              global SRC, ARGS
              SRC = gdal.Open(src_path)
              ARGS = args


          def tile_job(job):
              z, x = job
              W, H = SRC.RasterXSize, SRC.RasterYSize
              tiles_y = 2 ** z
              deg = 180.0 / tiles_y                      # tile size in degrees
              made = 0
              for y in range(tiles_y):
                  out = os.path.join(ARGS.out, str(z), str(x), f"{y}.{ARGS.ext}")
                  if os.path.exists(out):
                      continue
                  west = -180.0 + x * deg
                  north = 90.0 - y * deg
                  # degrees -> source pixels (float), then clamp to the raster
                  px0 = (west + 180.0) / 360.0 * W
                  py0 = (90.0 - north) / 180.0 * H
                  pw = deg / 360.0 * W
                  ph = deg / 180.0 * H
                  os.makedirs(os.path.dirname(out), exist_ok=True)
                  opts = gdal.TranslateOptions(
                      format='JPEG' if ARGS.ext == 'jpg' else 'PNG',
                      srcWin=[px0, py0, pw, ph],
                      width=ARGS.size, height=ARGS.size,
                      resampleAlg='average' if pw > ARGS.size else 'bilinear',
                      creationOptions=[f'QUALITY={ARGS.quality}'] if ARGS.ext == 'jpg' else [],
                      bandList=[1, 2, 3] if SRC.RasterCount >= 3 else [1],
                  )
                  tmp = out + '.part'
                  gdal.Translate(tmp, SRC, options=opts)
                  for extra in (tmp + '.aux.xml',):
                      if os.path.exists(extra):
                          os.remove(extra)
                  os.replace(tmp, out)
                  made += 1
              return made


          def main():
              p = argparse.ArgumentParser()
              p.add_argument('source')
              p.add_argument('out')
              p.add_argument('--max-zoom', type=int, default=8)
              p.add_argument('--min-zoom', type=int, default=0)
              p.add_argument('--workers', type=int, default=max(1, (os.cpu_count() or 2) - 1))
              p.add_argument('--quality', type=int, default=85)
              p.add_argument('--size', type=int, default=256)
              p.add_argument('--ext', choices=['jpg', 'png'], default='jpg')
              args = p.parse_args()

              ds = gdal.Open(args.source)
              print(f'Source: {ds.RasterXSize} x {ds.RasterYSize}, {ds.RasterCount} band(s)')
              if ds.GetRasterBand(1).GetOverviewCount() == 0:
                  print('Note: no overviews found. Low zoom levels will be slow; run gdaladdo first (see README).')
              ds = None

              jobs = [(z, x) for z in range(args.min_zoom, args.max_zoom + 1) for x in range(2 ** (z + 1))]
              total_tiles = sum(2 ** (z + 1) * 2 ** z for z in range(args.min_zoom, args.max_zoom + 1))
              print(f'Zoom {args.min_zoom}-{args.max_zoom}: {total_tiles:,} tiles, {args.workers} workers')
              t0 = time.time(); done = 0
              with Pool(args.workers, initializer=init, initargs=(args.source, args)) as pool:
                  for i, n in enumerate(pool.imap_unordered(tile_job, jobs), 1):
                      done += n
                      if i % 50 == 0 or i == len(jobs):
                          print(f'  columns {i}/{len(jobs)}  new tiles {done:,}  {time.time()-t0:,.0f}s', flush=True)
